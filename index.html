<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}</style>
</head>
<body>
<title>ベチベチ上司</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one-screen phone game. HUD on top, the boss fills the stage, weapon bar at the bottom. Comic-panel look, single light theme by choice. */
:root {
  --wall: #DCE5E1;      /* institutional office green-grey */
  --wall-2: #C3D1CC;
  --ink: #1F2430;
  --paper: #FFFDF8;
  --punch: #FF4F3A;     /* hit red */
  --pow: #FFD43B;       /* onomatopoeia yellow */
  --muted: #5B6670;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--wall); color: var(--ink);
  font-family: var(--font-body); font-weight: 500;
  overflow: hidden; touch-action: manipulation;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#app { height: 100%; display: flex; flex-direction: column; position: relative; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* HUD */
.hud { padding-block: 10px 6px; display: grid; gap: 6px; }
.hud-row { display: flex; align-items: center; gap: 10px; }
.target { flex: 1; min-width: 0; }
.eyebrow { font-size: 11px; letter-spacing: .12em; color: var(--muted); font-weight: 800; }
.target-name { font-family: var(--font-display); font-size: 20px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill {
  font: 800 13px var(--font-body); color: var(--ink); background: var(--paper);
  border: 2px solid var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
.pill:active { transform: translateY(1px); }
.timer { text-align: right; }
.timer-n { font-family: var(--font-display); font-size: 20px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.timer-n small { font: 800 11px var(--font-body); margin-left: 2px; }
.meter-wrap { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
.meter-label { font-size: 12px; font-weight: 800; }
.meter { height: 16px; border: 2.5px solid var(--ink); border-radius: 999px; background: var(--paper); overflow: hidden; }
.meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--pow), var(--punch)); transition: width .15s ease-out; }
.meter-pct { font-family: var(--font-display); font-size: 16px; min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }

/* Stage */
.stage { flex: 1; position: relative; min-height: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.bubble {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
  max-width: calc(100% - 32px); width: max-content;
  background: var(--paper); border: 2.5px solid var(--ink); border-radius: 18px;
  padding: 8px 16px; font-weight: 800; font-size: 17px; text-align: center; pointer-events: none;
  box-shadow: 3px 3px 0 var(--ink);
}
.bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -12px; width: 18px; height: 18px;
  background: var(--paper); border-right: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink);
  transform: translateX(-50%) rotate(45deg) skew(8deg, 8deg); border-bottom-right-radius: 4px;
}
.bubble.pop { animation: pop .22s ease-out; }
@keyframes pop { from { transform: translateX(-50%) scale(.6); } 70% { transform: translateX(-50%) scale(1.08); } to { transform: translateX(-50%) scale(1); } }
.combo {
  position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 70px; pointer-events: none;
  font-family: var(--font-display); color: var(--punch); text-align: right; line-height: 1;
  text-shadow: -2px -2px 0 var(--paper), 2px -2px 0 var(--paper), -2px 2px 0 var(--paper), 2px 2px 0 var(--paper), 4px 4px 0 var(--ink);
}
.combo b { font-size: 40px; font-weight: 400; display: block; font-variant-numeric: tabular-nums; }
.combo span { font-size: 14px; letter-spacing: .1em; }
.combo.bump { animation: bump .15s ease-out; }
.shout {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 76px; pointer-events: none;
  max-width: calc(100% - 140px); background: var(--punch); color: #fff;
  border: 2.5px solid var(--ink); border-radius: 14px; padding: 6px 12px 8px;
  font: 400 17px/1.3 var(--font-display); box-shadow: 3px 3px 0 var(--ink); transform: rotate(-3deg);
}
.shout small { display: block; font: 800 10px var(--font-body); letter-spacing: .12em; color: var(--pow); }
.shout::before {
  content: ""; position: absolute; left: 18px; top: -11px; width: 14px; height: 14px; background: var(--punch);
  border-left: 2.5px solid var(--ink); border-top: 2.5px solid var(--ink); transform: rotate(45deg);
}
.shout.pop { animation: shout .18s ease-out; }
@keyframes shout { from { transform: rotate(-8deg) scale(.6); } 70% { transform: rotate(-1deg) scale(1.1); } to { transform: rotate(-3deg) scale(1); } }
@keyframes bump { from { transform: scale(1.35) rotate(-6deg); } to { transform: scale(1); } }

/* Weapons */
.weapons { padding-block: 8px 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: var(--wall-2); border-top: 2.5px solid var(--ink); }
.weapon {
  display: grid; justify-items: center; gap: 2px; padding: 6px 2px 5px;
  background: var(--paper); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 14px;
  font: 800 12px var(--font-body); cursor: pointer; box-shadow: 0 3px 0 var(--ink);
}
.weapon svg { width: 30px; height: 30px; }
.weapon[aria-pressed="true"] { background: var(--pow); transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
button:focus-visible, input:focus-visible + label, input[type="text"]:focus-visible { outline: 3px solid var(--punch); outline-offset: 2px; }

/* Overlays */
.overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  background: linear-gradient(to bottom, rgba(31,36,48,0) 25%, rgba(31,36,48,.6));
  padding-block: 16px; z-index: 5; overflow-y: auto;
}
.card { margin-top: auto; flex-shrink: 0;
  width: min(100%, 420px); background: var(--paper); border: 3px solid var(--ink); border-radius: 22px;
  box-shadow: 6px 6px 0 var(--ink); padding: 18px; display: grid; gap: 12px;
  -webkit-user-select: text; user-select: text;
}
.card h1, .card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; line-height: 1.05; text-wrap: balance; }
.card h1 { font-size: 36px; color: var(--punch); text-shadow: 3px 3px 0 var(--ink); -webkit-text-stroke: 1.5px var(--ink); }
.card h2 { font-size: 40px; color: var(--pow); text-shadow: 3px 3px 0 var(--ink); -webkit-text-stroke: 1.5px var(--ink); }
.card p { margin: 0; line-height: 1.6; font-size: 14px; }
.field { display: grid; gap: 6px; }
.field > label, .field > .flabel { font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--muted); }
#name-input {
  font: 800 20px var(--font-body); color: var(--ink); background: #fff;
  border: 2.5px solid var(--ink); border-radius: 12px; padding: 10px 12px; width: 100%; box-sizing: border-box;
}
.roles { display: flex; flex-wrap: wrap; gap: 6px; }
.roles input { position: absolute; opacity: 0; pointer-events: none; }
.roles label {
  font: 800 14px var(--font-body); padding: 6px 12px; border: 2px solid var(--ink); border-radius: 999px; cursor: pointer; background: #fff;
}
.roles input:checked + label { background: var(--ink); color: var(--paper); }
.go {
  font: 400 22px var(--font-display); color: #fff; background: var(--punch);
  border: 3px solid var(--ink); border-radius: 16px; padding: 14px; cursor: pointer; box-shadow: 4px 4px 0 var(--ink);
}
.go:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.note { font-size: 11px !important; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { border: 2px solid var(--ink); border-radius: 12px; padding: 8px; text-align: center; background: #fff; }
.stat b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; font-weight: 800; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sub { font: 800 15px var(--font-body); color: var(--ink); background: #fff; border: 2.5px solid var(--ink); border-radius: 14px; padding: 12px; cursor: pointer; }
.reveal { display: grid; justify-items: center; gap: 6px; text-align: center; padding-top: 4px; }
.reveal-label { font-weight: 800; font-size: 14px; }
.stamp {
  position: relative; display: grid; justify-items: center; gap: 2px; max-width: 100%;
  border: 4px solid var(--punch); outline: 2px solid var(--punch); outline-offset: 3px; border-radius: 10px;
  padding: 10px 18px 12px; transform: rotate(-4deg); background: #fff;
}
.stamp.go-in { animation: stamp .45s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes stamp { from { transform: rotate(-14deg) scale(2.6); opacity: 0; } 60% { opacity: 1; } to { transform: rotate(-4deg) scale(1); } }
.stars { color: var(--punch); font-size: 16px; letter-spacing: .15em; }
.title-big { font-family: var(--font-display); font-size: clamp(26px, 9vw, 40px); line-height: 1.1; color: var(--punch); text-wrap: balance; overflow-wrap: anywhere; }
.new { position: absolute; top: -14px; right: -14px; transform: rotate(10deg); font: 400 13px var(--font-display); color: var(--ink); background: var(--pow); border: 2px solid var(--ink); border-radius: 999px; padding: 3px 8px; animation: blink .8s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }
.rank-desc { font-size: 13px !important; color: var(--muted); font-weight: 800; }
.also { font-size: 12px !important; }
.also b { background: var(--pow); border: 1.5px solid var(--ink); border-radius: 999px; padding: 1px 8px; margin: 2px; display: inline-block; font-weight: 800; }
.list-btn { width: 100%; }
#list-ov { z-index: 7; background: rgba(31,36,48,.6); }
.list-card { margin-block: auto !important; max-height: 100%; min-height: 0; box-sizing: border-box; grid-template-rows: auto auto 1fr; overflow: hidden; }
.list-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.list-head h3 { margin: 0; font: 400 26px var(--font-display); }
.prog { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.prog b { font-family: var(--font-display); font-weight: 400; font-size: 18px; font-variant-numeric: tabular-nums; }
.col-list { list-style: none; margin: 0; padding: 2px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; overflow-y: auto; min-height: 0; align-content: start; }
.col-list li { position: relative; border: 2px solid var(--ink); border-radius: 10px; padding: 6px 8px; font-size: 13px; font-weight: 800; line-height: 1.3; min-width: 0; }
.col-list li .st { display: block; font-size: 10px; color: var(--punch); letter-spacing: .1em; }
.col-list li small { display: block; font-size: 10px; font-weight: 500; color: var(--muted); }
.col-list li .cnt { position: absolute; top: 4px; right: 6px; font-size: 10px; color: var(--muted); }
.col-list li.got { background: #FFF3B8; }
.col-list li.locked { border-style: dashed; color: var(--muted); background: #fff; }
.col-list .sec { grid-column: 1 / -1; border: 0; padding: 6px 0 0; font-size: 12px; letter-spacing: .1em; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .new, .stamp.go-in { animation: none; } }

.badge { display: inline-block; background: var(--ink); color: var(--pow); font-weight: 800; font-size: 13px; padding: 4px 10px; border-radius: 999px; justify-self: start; }
.lines { display: grid; gap: 6px; }
.line-row { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
.line-row input {
  font: 800 16px var(--font-body); color: var(--ink); background: #fff; min-width: 0;
  border: 2.5px solid var(--ink); border-radius: 12px; padding: 8px 12px; box-sizing: border-box;
}
.line-row input:focus-visible { outline: 3px solid var(--punch); outline-offset: 2px; }
.line-row button { font: 800 16px var(--font-body); width: 40px; border: 2.5px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); cursor: pointer; }
.add-line { justify-self: start; font: 800 14px var(--font-body); color: var(--ink); background: var(--pow); border: 2px solid var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.add-line[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { .bubble.pop, .combo.bump, .shout.pop { animation: none; } }
</style>

<div id="app">
  <header class="hud gutter">
    <div class="hud-row">
      <div class="target">
        <div class="eyebrow">TARGET</div>
        <div class="target-name" id="target-name">田中 部長</div>
      </div>
      <div class="timer"><div class="eyebrow">TIME</div><div class="timer-n"><span id="timer">0.0</span><small>秒</small></div></div>
      <button class="pill" id="mute-btn" type="button" aria-pressed="false">音 ON</button>
      <button class="pill" id="back-btn" type="button">名前変更</button>
    </div>
    <div class="meter-wrap">
      <span class="meter-label">スッキリ度</span>
      <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="meter"><div class="meter-fill" id="meter-fill"></div></div>
      <span class="meter-pct" id="meter-pct">0%</span>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="bubble" id="bubble" hidden>私に何か用かね？</div>
    <div class="shout" id="shout" hidden><small>あなた</small><span id="shout-text"></span></div>
    <div class="combo" id="combo" hidden><b id="combo-n">0</b><span>COMBO</span></div>
  </main>

  <nav class="weapons gutter" aria-label="武器">
    <button class="weapon" type="button" data-w="binta" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="#F6C9A0" stroke="#1F2430" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M7 12V5.5a1.5 1.5 0 0 1 3 0V11M10 10V4a1.5 1.5 0 0 1 3 0v7M13 10.5V5a1.5 1.5 0 0 1 3 0v6.5M16 11.5V8a1.5 1.5 0 0 1 3 0v6a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-2.7l-2.4-3.7a1.5 1.5 0 0 1 2.4-1.8L7 15z"/></svg>
      ビンタ
    </button>
    <button class="weapon" type="button" data-w="harisen" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="#fff" stroke="#1F2430" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M12 20 3 7q9-6 18 0z"/><path d="M12 20 6.5 4.6M12 20 9.2 3.4M12 20V3M12 20l2.8-16.6M12 20l5.5-15.4" fill="none"/><rect x="9.5" y="17" width="5" height="5" rx="1" fill="#FF4F3A"/></svg>
      ハリセン
    </button>
    <button class="weapon" type="button" data-w="piko" aria-pressed="false">
      <svg viewBox="0 0 24 24" stroke="#1F2430" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M11 12l6 9" fill="none" stroke-width="3"/><path d="M11 12l6 9" fill="none" stroke="#FFD43B" stroke-width="1.4"/><rect x="2.5" y="4" width="15" height="8.5" rx="3.5" transform="rotate(-20 10 8)" fill="#FF4F3A"/><path d="M5.2 6.3 3 9.6M14.3 3 12 6.4" fill="none" stroke="#FFD43B" stroke-width="2"/></svg>
      ピコハン
    </button>
    <button class="weapon" type="button" data-w="makura" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="#E8F1FF" stroke="#1F2430" stroke-width="1.6" stroke-linejoin="round"><path d="M4 6.5c3.5-2 12.5-2 16 0 1.6 3.5 1.6 7.5 0 11-3.5 2-12.5 2-16 0-1.6-3.5-1.6-7.5 0-11z"/><path d="M8 10q4 2 8 0" fill="none"/></svg>
      まくら
    </button>
  </nav>

  <section class="overlay gutter" id="title-ov">
    <form class="card" id="start-form" autocomplete="off">
      <h1>ベチベチ上司</h1>
      <p>ムカつく上司の名前を入れて、顔を連打。スッキリ度100%で上司が反省します。</p>
      <div class="field">
        <label for="name-input">上司の名前</label>
        <input id="name-input" type="text" maxlength="12" placeholder="例：田中" enterkeyhint="go">
      </div>
      <div class="field">
        <span class="flabel">役職</span>
        <div class="roles" id="roles">
          <input type="radio" name="role" id="r1" value="部長" checked><label for="r1">部長</label>
          <input type="radio" name="role" id="r2" value="課長"><label for="r2">課長</label>
          <input type="radio" name="role" id="r3" value="係長"><label for="r3">係長</label>
          <input type="radio" name="role" id="r4" value="社長"><label for="r4">社長</label>
          <input type="radio" name="role" id="r5" value="先輩"><label for="r5">先輩</label>
          <input type="radio" name="role" id="r6" value=""><label for="r6">なし</label>
        </div>
      </div>
      <div class="field">
        <span class="flabel">言ってやりたいこと（いくつでも・空欄なら定番セリフ）</span>
        <div class="lines" id="lines-list"></div>
        <button class="add-line" type="button" id="add-line">＋ セリフを追加</button>
      </div>
      <button class="go" type="submit">ベチベチする！</button>
      <button class="sub list-btn" type="button" id="list-btn-title">称号一覧を見る</button>
      <p class="note">※ 登場するのはイラストの上司です。現実の上司は叩かないでね。</p>
    </form>
  </section>

  <section class="overlay gutter" id="result-ov" hidden>
    <div class="card">
      <div class="reveal">
        <div class="reveal-label">スッキリ完了！ あなたの称号は…</div>
        <div class="stamp" id="stamp"><span class="stars" id="rank-stars">★</span><div class="title-big" id="rank">称号</div><span class="new" id="rank-new" hidden>NEW!</span></div>
        <p class="rank-desc" id="rank-desc"></p>
        <p class="also" id="also" hidden></p>
      </div>
      <div class="stats">
        <div class="stat"><b id="st-hits">0</b><span>叩いた回数</span></div>
        <div class="stat"><b id="st-combo">0</b><span>最大コンボ</span></div>
        <div class="stat"><b id="st-time">0.0</b><span>秒</span></div>
      </div>
      <button class="go" type="button" id="again-btn">もう一回ベチベチ</button>
      <div class="row2">
        <button class="sub" type="button" id="rename-btn">名前を変える</button>
        <button class="sub" type="button" id="copy-btn">結果をコピー</button>
      </div>
      <button class="sub list-btn" type="button" id="list-btn-result">称号一覧を見る</button>
    </div>
  </section>

  <section class="overlay gutter" id="list-ov" hidden>
    <div class="card list-card">
      <div class="list-head"><h3>称号一覧</h3><button class="pill" type="button" id="list-close">閉じる</button></div>
      <div class="prog"><div class="meter"><div class="meter-fill" id="list-fill"></div></div><b id="list-count">0/0</b></div>
      <ul class="col-list" id="col-list"></ul>
    </div>
  </section>
</div>

<script>
(() => {
  // ---------- constants ----------
  const VW = 400, VH = 600;
  const HEAD = { x: 200, y: 245, rx: 112, ry: 124 };
  const INK = '#1F2430', SKIN = '#F4C7A1', SKIN2 = '#EDB48A', HAIR = '#2E2A2B', HAIR_HI = '#57504F', BROW = '#3A3F4A', NAVY = '#2C3754', TIE = '#C8323C';
  const DISPLAY = '"Dela Gothic One", "Hiragino Sans", sans-serif';
  const BODYF = '"M PLUS Rounded 1c", "Hiragino Sans", sans-serif';
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const WEAPONS = {
    binta:   { power: 1.0,  push: 1.0, bump: 0.25, words: ['バチン!', 'ベチッ!', 'パァン!', 'ベチベチ!'], color: '#FFD43B' },
    harisen: { power: 1.25, push: 1.3, bump: 0.35, words: ['スパーン!', 'パシーン!', 'スパァン!'], color: '#FFFFFF' },
    piko:    { power: 0.9,  push: 0.6, bump: 0.8,  words: ['ピコッ!', 'ピコン!', 'ピコピコ!'], color: '#FF8FB1' },
    makura:  { power: 0.75, push: 0.7, bump: 0,    words: ['ボフッ!', 'モフッ!', 'ボスッ!'], color: '#BFE3FF' },
  };
  const LINES = [

  }
  function toTitle() {
    reset(); S.mode = 'title'; $('result-ov').hidden = true; $('title-ov').hidden = false; bubble.hidden = true; refreshTitleBtn();
  }

  // ---------- UI wiring ----------
  function readForm() {
    S.name = nameInput.value.trim() || '田中';
    const r = document.querySelector('#roles input:checked'); S.role = r ? r.value : '';
    updateHUD();
  }
  nameInput.addEventListener('input', readForm);
  document.querySelectorAll('#roles input').forEach(i => i.addEventListener('change', readForm));
  $('start-form').addEventListener('submit', (e) => {
    e.preventDefault(); ensureAudio(); readForm(); parseLines(); document.activeElement && document.activeElement.blur();
    try { localStorage.setItem('bechibechi-v1', JSON.stringify({ name: nameInput.value.trim(), role: S.role, lines: customLines })); } catch (err) {}
    startGame();
  });
  $('again-btn').addEventListener('click', () => { ensureAudio(); startGame(); });
  $('rename-btn').addEventListener('click', toTitle);
  $('list-btn-title').addEventListener('click', openList);
  $('list-btn-result').addEventListener('click', openList);
  $('list-close').addEventListener('click', () => { $('list-ov').hidden = true; });
  $('back-btn').addEventListener('click', toTitle);
  $('mute-btn').addEventListener('click', (e) => {
    muted = !muted; e.currentTarget.textContent = muted ? '音 OFF' : '音 ON'; e.currentTarget.setAttribute('aria-pressed', String(muted));
  });
  $('copy-btn').addEventListener('click', (e) => {
    const btn = e.currentTarget;
    const text = `${fullName()}を${S.hits}回ベチベチして${(S.koT - S.startT).toFixed(1)}秒でスッキリした！（最大${S.maxCombo}コンボ）称号：${lastTitle ? lastTitle.name : ''}`;
    const done = () => { btn.textContent = 'コピーしました'; setTimeout(() => btn.textContent = '結果をコピー', 1500); };
    const fail = () => { btn.textContent = 'コピーできませんでした'; setTimeout(() => btn.textContent = '結果をコピー', 1500); };
    try { navigator.clipboard.writeText(text).then(done, fail); } catch (err) { fail(); }
  });
  document.querySelectorAll('.weapon').forEach(b => b.addEventListener('click', () => {
    if (S.mode === 'play' && S.weapon !== b.dataset.w) S.switches++;
    S.weapon = b.dataset.w; document.querySelectorAll('.weapon').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    ensureAudio();
  }));

  // ---------- loop ----------
  let last = performance.now(), idleSayT = 0;
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
    // springs
    const ko = S.mode === 'ko' || S.mode === 'result';
    P.rot.t = ko ? 0.32 : 0; P.oy.t = ko ? 18 : 0;
    for (const k in P) {
      const p = P[k], K = (k === 'sx' || k === 'sy') ? 520 : k === 'card' ? 60 : 240, C = (k === 'sx' || k === 'sy') ? 16 : k === 'card' ? 3 : 11;
      p.vel += (-K * (p.v - p.t) - C * p.vel) * dt; p.v += p.vel * dt;
    }
    for (const b of bumps) b.r += (b.target - b.r) * Math.min(1, dt * 18);
    stepParts(dt);
    shake *= Math.pow(0.0005, dt);
    // taunt when idle
    if (S.mode === 'play' && t - S.lastHit > 0.7 && !comboEl.hidden) comboEl.hidden = true;

    $('timer').textContent = (S.mode === 'play' ? t - S.startT : S.mode === 'title' ? 0 : S.koT - S.startT).toFixed(1);
    // draw
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#DCE5E1'; ctx.fillRect(0, 0, cw, ch);
    const sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) : 0;
    ctx.translate(offX + sx * sc, offY + sy * sc); ctx.scale(sc, sc);
    drawRoom(); drawBody(); drawHead(); drawParts();
    requestAnimationFrame(frame);
  }
  if (!linesList.children.length) { addLineRow(); addLineRow(); }
  refreshTitleBtn();
  updateHUD();
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => {});
  requestAnimationFrame(frame);
})();
</script>
